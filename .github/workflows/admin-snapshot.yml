name: Admin Dashboard Snapshot
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Admin Snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "5026996405"
        run: |
          # 1. Call your API
          echo "Calling snapshot API..."
          API_RESPONSE=$(curl -s -H "Authorization: Bearer $CRON_SECRET" https://retention.otobrixai.com/api/cron/snapshot)
          echo "API Response: $API_RESPONSE"
          
          # 2. Send to Telegram
          echo "Sending to Telegram..."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=📊 Admin Snapshot:
          
          $API_RESPONSE" \
            -d "parse_mode=Markdown"
          
          echo "✅ Done!"
          