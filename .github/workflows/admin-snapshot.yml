name: Admin Dashboard Snapshot
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Call API and check response
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $CRON_SECRET" https://retention.otobrixai.com/api/cron/snapshot)
          
          # Get HTTP status code
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          # Save response for error handling
          echo "$BODY" > response.json
          echo "HTTP_CODE=$HTTP_CODE" >> $GITHUB_ENV
          
          # Check if failed
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAILED=true" >> $GITHUB_ENV
            echo "ERROR_RESPONSE=$BODY" >> $GITHUB_ENV
            echo "❌ Snapshot failed with HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Snapshot successful"
      
      - name: Send Failure Notification
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "5026996405"
        run: |
          # Extract error message from response
          ERROR_MSG=$(cat response.json | grep -o '"error":"[^"]*"' | cut -d'"' -f4 || echo "Unknown error")
          
          MESSAGE="❌ ADMIN SNAPSHOT FAILED
          
          Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          Error: $ERROR_MSG
          HTTP Code: ${{ env.HTTP_CODE }}
          
          Action required: Check logs immediately"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"