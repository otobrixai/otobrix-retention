name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        working-directory: ${{ github.workspace }}
        run: pnpm exec next lint || true

      - name: Typecheck
        run: pnpm exec tsc --noEmit || true

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm test || true

      - name: Run smoke tests
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
        run: |
          if [ -f ".next/standalone/server.js" ]; then
            node .next/standalone/server.js -p 3000 & sleep 4
          else
            pnpm run start:ci & sleep 4
          fi
          node scripts/smoke/health-check.js || true
          node scripts/smoke/csrf-test.js || true
          node scripts/smoke/rate-limit-test.js || true